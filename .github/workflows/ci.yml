name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dorg.gradle.daemon=false
  ANDROID_NDK_VERSION: 30.0.16248370
  ANDROID_CMAKE_VERSION: 4.1.2

jobs:
  native-libs:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK components
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-37.2" "build-tools;37.0.0" "platform-tools" \
            "ndk;$ANDROID_NDK_VERSION" "cmake;$ANDROID_CMAKE_VERSION"
      - uses: actions/cache@v4
        id: native-cache
        with:
          path: |
            .cache/native/jniLibs
            .cache/native-llama
            .cache/native/build/sherpa
          key: native-${{ runner.os }}-ndk${{ env.ANDROID_NDK_VERSION }}-cmake${{ env.ANDROID_CMAKE_VERSION }}-${{ hashFiles('native/llama/versions.env', 'native/llama/patches/**', 'native/sherpa/build-android.sh', 'native/sherpa/patches/**', 'native/sherpa/qnn-probe/**') }}
      - name: Build sherpa-onnx JNI (arm64 + x86_64)
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: JOBS="$(nproc)" bash native/sherpa/build-android.sh all
      - name: Build llama.cpp (arm64 + x86_64)
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: NO_HEAVY=1 JOBS="$(nproc)" bash native/llama/build_android.sh cpu-arm64 cpu-x86_64
      - name: Check the installed libraries
        run: bash tools/e2e/check_native_libs.sh
      - uses: actions/upload-artifact@v4
        with:
          name: native-jnilibs
          path: .cache/native/jniLibs
          if-no-files-found: error
          retention-days: 7

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK components
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-37.2" "build-tools;37.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch model assets used by the host tests
        run: python3 tools/models/fetch pp-ocrv6-tiny-det@onnx pp-ocrv5-cyrillic-mobile-rec@onnx
      - name: Unit tests
        env:
          MURMUR_OCR_PARITY: off
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: "**/build/test-results/**"
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: native-libs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK components
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-37.2" "build-tools;37.0.0" "platform-tools"
      - uses: actions/download-artifact@v4
        with:
          name: native-jnilibs
          path: .cache/native/jniLibs
      - name: Check the installed libraries
        run: bash tools/e2e/check_native_libs.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble debug and release
        run: ./gradlew assembleDebug assembleRelease --stacktrace
      - name: Check that both APKs ship the engines
        run: |
          bash tools/e2e/check_apk_engines.sh app/build/outputs/apk/debug/app-debug.apk arm64-v8a x86_64
          bash tools/e2e/check_apk_engines.sh app/build/outputs/apk/release/app-release-unsigned.apk arm64-v8a
      - name: Check release APK contents
        run: bash tools/e2e/check_release_apk.sh --no-build
      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/murmur-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/murmur-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

  release-apk:
    needs: [native-libs, unit-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute release version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            SKIP="false"
          else
            EXISTING="$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
            if [ -n "$EXISTING" ]; then
              echo "HEAD is already tagged as $EXISTING; skipping auto-release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            LATEST="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
            if [ -z "$LATEST" ]; then
              TAG="v0.1.0"
            else
              IFS='.' read -r MAJ MIN PAT <<< "${LATEST#v}"
              TAG="v${MAJ}.${MIN}.$((10#$PAT + 1))"
            fi
            SKIP="false"
          fi
          VERSION_NAME="${TAG#v}"
          CORE="${VERSION_NAME%%[-+]*}"
          IFS='.' read -r MAJOR MINOR PATCH _ <<< "$CORE"
          if [[ "$MAJOR" =~ ^[0-9]+$ && "$MINOR" =~ ^[0-9]+$ && "$PATCH" =~ ^[0-9]+$ ]]; then
            VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          else
            VERSION_CODE=2
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "Prepared release tag=$TAG versionName=$VERSION_NAME versionCode=$VERSION_CODE"
      - uses: actions/setup-java@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK components
        if: steps.ver.outputs.skip != 'true'
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" --install "platforms;android-37.2" "build-tools;37.0.0" "platform-tools"
      - uses: actions/download-artifact@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          name: native-jnilibs
          path: .cache/native/jniLibs
      - uses: gradle/actions/setup-gradle@v4
        if: steps.ver.outputs.skip != 'true'
      - name: Decode release keystore
        id: keystore
        if: steps.ver.outputs.skip != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.MURMUR_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/murmur-release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "store_file=$RUNNER_TEMP/murmur-release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Assemble debug and release
        if: steps.ver.outputs.skip != 'true'
        env:
          MURMUR_RELEASE_STORE_FILE: ${{ steps.keystore.outputs.store_file }}
          MURMUR_RELEASE_STORE_PASSWORD: ${{ secrets.MURMUR_RELEASE_STORE_PASSWORD }}
          MURMUR_RELEASE_KEY_ALIAS: ${{ secrets.MURMUR_RELEASE_KEY_ALIAS }}
          MURMUR_RELEASE_KEY_PASSWORD: ${{ secrets.MURMUR_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleDebug assembleRelease \
            -Pmurmur.versionName="${{ steps.ver.outputs.version_name }}" \
            -Pmurmur.versionCode="${{ steps.ver.outputs.version_code }}" \
            --stacktrace
      - name: Check that both APKs ship the engines
        if: steps.ver.outputs.skip != 'true'
        run: |
          bash tools/e2e/check_apk_engines.sh app/build/outputs/apk/debug/app-debug.apk arm64-v8a x86_64
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          else
            RELEASE_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          bash tools/e2e/check_apk_engines.sh "$RELEASE_APK" arm64-v8a
          bash tools/e2e/check_release_apk.sh --no-build "$RELEASE_APK"
      - name: Collect APKs
        if: steps.ver.outputs.skip != 'true'
        run: |
          mkdir -p dist
          TAG="${{ steps.ver.outputs.tag }}"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/murmur-${TAG}-debug.apk"
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/murmur-${TAG}-release.apk"
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/murmur-${TAG}-release-unsigned.apk"
          fi
      - name: Publish GitHub Release
        if: steps.ver.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/*.apk
          fail_on_unmatched_files: true
